<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER TCG - プレイング画面</title>
    <style>
        :root {
            --bg-cyber: #0a0a12;
            --panel-cyber: #121225;
            --neon-blue: #00f3ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --text-main: #ffffff;
            --text-sub: #8a8ab0;
        }

        body {
            font-family: 'Consolas', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-cyber);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            font-size: 28px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .room-info {
            font-size: 14px;
            color: var(--neon-pink);
            margin-bottom: 20px;
            text-shadow: 0 0 5px var(--neon-pink);
        }

        .game-board {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .card-area {
            background: var(--panel-cyber);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            min-height: 220px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .area-label {
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--bg-cyber);
            padding: 0 10px;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
            border-left: 3px solid var(--neon-pink);
        }

        .card {
            width: 180px;
            height: 270px;
            background: linear-gradient(135deg, #151630 0%, #0d0e1a 100%);
            border: 2px solid #2d2f55;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
        }

        .card-img-wrapper {
            width: 100%;
            height: 140px;
            background: #1b1c3a;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .card:hover .card-img {
            opacity: 1;
        }

        .card-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            background: rgba(10, 10, 18, 0.6);
        }

        .card-name {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 2px;
        }

        .card-effect {
            font-size: 11px;
            color: var(--text-sub);
            line-height: 1.4;
            flex-grow: 1;
        }

        .card-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 0, 127, 0.8);
            color: #fff;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 5px var(--neon-pink);
        }

        .badge-normal {
            background: rgba(0, 243, 255, 0.8);
            box-shadow: 0 0 5px var(--neon-blue);
        }

        .control-panel {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-shadow: 0 0 5px var(--neon-pink);
        }

        .cyber-btn:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-pink);
        }
    </style>
</head>
<body>

    <h1>CYBER DECK INTERFACE</h1>
    <div class="room-info" id="roomDisplay">ROOM: LOADING...</div>

    <div class="game-board">
        <div class="card-area" id="battleField">
            <div class="area-label">BATTLE FIELD (バトル場)</div>
            <div style="color: var(--text-sub); font-size: 14px;">手札のカードをクリックして場に出せます</div>
        </div>

        <div class="card-area" id="playerHand">
            <div class="area-label">YOUR HAND (手札)</div>
        </div>
    </div>

    <div class="control-panel">
        <button class="cyber-btn" onclick="resetGame()">フィールドをリセット</button>
        <button class="cyber-btn" style="border-color: var(--neon-blue); color: var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue);" onclick="window.location.href='index.html'">ロビーに戻る</button>
    </div>

<script>
    // URLパラメータの取得
    const urlParams = new URLSearchParams(window.location.search);
    const roomName = urlParams.get('room') || 'UNKNOWN';
    const playerName = urlParams.get('name') || 'トレーナー';
    document.getElementById('roomDisplay').innerText = `ROOM: ${roomName} | PLAYER: ${playerName}`;

    // カードデータ構造化
    const cardList = [
        {
            id: "c1",
            name: "打打だいず",
            effect: "ラウンドに勝利すると次のターン攻撃力2倍",
            type: "通常",
            image: "https://via.placeholder.com/180x140/1a1a2e/39ff14?text=DAIZU"
        },
        {
            id: "c2",
            name: "Laur",
            effect: "ラウンドに勝利すると魑魅魍魎を召喚",
            type: "通常",
            image: "https://via.placeholder.com/180x140/1a1a2e/ff007f?text=Laur"
        },
        {
            id: "c3",
            name: "TJ.hangneil",
            effect: "相手から4ポイント奪取できる",
            type: "特殊召喚",
            image: "https://via.placeholder.com/180x140/1a1a2e/00f3ff?text=TJ.hangneil"
        },
        {
            id: "c4",
            name: "sasakure.UK",
            effect: "3ラウンド連続で勝利すると?????を召喚できる",
            type: "通常",
            image: "https://via.placeholder.com/180x140/1a1a2e/e5c583?text=sasakure"
        },
        {
            id: "c5",
            name: "t+pazolite",
            effect: "ラウンドに勝利すると相手と自分の点数を逆にできる",
            type: "通常",
            image: "https://via.placeholder.com/180x140/1a1a2e/94d2bd?text=t%2Bpazolite"
        }
    ];

    function renderHand() {
        const handContainer = document.getElementById('playerHand');
        handContainer.innerHTML = '';

        cardList.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.onclick = () => playCard(card, cardEl);

            const badgeClass = card.type === "特殊召喚" ? "card-badge" : "card-badge badge-normal";

            cardEl.innerHTML = `
                <span class="${badgeClass}">${card.type}</span>
                <div class="card-img-wrapper">
                    <img src="${card.image}" class="card-img" alt="${card.name}">
                </div>
                <div class="card-info">
                    <div class="card-name">${card.name}</div>
                    <div class="card-effect">${card.effect}</div>
                </div>
            `;
            handContainer.appendChild(cardEl);
        });
    }

    function playCard(card, cardElement) {
        const field = document.getElementById('battleField');
        if(field.querySelector('div') && field.querySelector('div').style.color !== '') {
            field.innerHTML = '';
        }

        const clonedCard = cardElement.cloneNode(true);
        clonedCard.onclick = null;
        field.appendChild(clonedCard);

        cardElement.style.opacity = '0.3';
        cardElement.style.pointerEvents = 'none';
    }

    function resetGame() {
        document.getElementById('battleField').innerHTML = '<div style="color: var(--text-sub); font-size: 14px;">手札のカードをクリックして場に出せます</div>';
        renderHand();
    }

    renderHand();
</script>

</body>
</html>
