<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYBER TCG - ロビー</title>
<style>
:root{--bg:#080812;--panel:#121225;--blue:#00f3ff;--pink:#ff007f;--text:#fff;--sub:#9090b5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Consolas,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:min(460px,100%);background:var(--panel);border:1px solid #27305c;border-radius:16px;padding:28px;box-shadow:0 0 30px #00f3ff18}
h1{color:var(--blue);text-align:center;letter-spacing:2px;margin:0 0 6px;text-shadow:0 0 10px #00f3ff}.sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:25px}
label{display:block;color:var(--blue);font-size:12px;margin:14px 0 6px}input{width:100%;padding:13px;border-radius:8px;border:1px solid #38406d;background:#080812;color:#fff;font-size:16px}
button{width:100%;padding:13px;margin-top:12px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;background:transparent;color:var(--blue);border:1px solid var(--blue)}
button.primary{background:var(--pink);border-color:var(--pink);color:#fff}.divider{text-align:center;color:var(--sub);margin:20px 0 5px;font-size:12px}
.note{margin-top:18px;color:var(--sub);font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div class="box">
<h1>CYBER TCG LOBBY</h1>
<div class="sub">対戦・観戦に対応したオンラインロビー</div>
<label for="name">プレイヤー名</label>
<input id="name" maxlength="20" placeholder="名無しトレーナー" value="プレイヤー1">
<button class="primary" id="create">新しく対戦ルームを作る</button>
<div class="divider">または</div>
<label for="room">ルームID</label>
<input id="room" maxlength="20" placeholder="例: ROOM-1234">
<button id="join">対戦に参加する</button>
<button id="watch">観戦する</button>
<div class="note">※この版はFirebase Realtime Databaseを使用します。READMEのFirebase設定を最初に行ってください。</div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getDatabase,ref,set,get} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig={
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_PROJECT.firebaseapp.com",
  databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId:"YOUR_PROJECT",
  storageBucket:"YOUR_PROJECT.appspot.com",
  messagingSenderId:"YOUR_SENDER_ID",
  appId:"YOUR_APP_ID"
};

const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app);
await signInAnonymously(auth);

const $=id=>document.getElementById(id);
function name(){return $("name").value.trim().slice(0,20)}
function room(){return $("room").value.trim().toUpperCase()}
function go(r,n,mode){location.href=`game.html?room=${encodeURIComponent(r)}&name=${encodeURIComponent(n)}&mode=${mode}`}
function newRoom(){return "ROOM-"+Math.floor(1000+Math.random()*9000)}

$("create").onclick=async()=>{
 const n=name(); if(!n)return alert("プレイヤー名を入力してください");
 let r=newRoom(); let tries=0;
 while((await get(ref(db,"rooms/"+r))).exists() && tries++<10)r=newRoom();
 await set(ref(db,"rooms/"+r),{
   createdAt:Date.now(),turn:"p1",phase:"waiting",winner:null,
   players:{p1:{name:n,hp:20,energy:3,score:0,card:null},p2:null},
   cards:{p1:[],p2:[]},log:["ルームを作成しました"]
 });
 go(r,n,"player");
};
$("join").onclick=async()=>{
 const n=name(),r=room(); if(!n)return alert("プレイヤー名を入力してください"); if(!r)return alert("ルームIDを入力してください");
 const s=await get(ref(db,"rooms/"+r)); if(!s.exists())return alert("そのルームは存在しません");
 const d=s.val(); if(d.players.p2)return alert("このルームはすでに2人対戦中です");
 await set(ref(db,"rooms/"+r+"/players/p2"),{name:n,hp:20,energy:3,score:0,card:null});
 await set(ref(db,"rooms/"+r+"/phase"),"battle");
 go(r,n,"player");
};
$("watch").onclick=async()=>{
 const r=room(); if(!r)return alert("ルームIDを入力してください");
 const s=await get(ref(db,"rooms/"+r)); if(!s.exists())return alert("そのルームは存在しません");
 go(r,name()||"観戦者","spectator");
};
</script>
</body>
</html>
