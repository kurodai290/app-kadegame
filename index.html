<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYBER TCG - ロビー</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080812;color:#fff;font-family:Consolas,Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:20px}
.box{width:min(480px,100%);background:#121225;border:1px solid #28315b;border-radius:16px;padding:28px;box-shadow:0 0 30px #00f3ff18}
h1{text-align:center;color:#00f3ff;letter-spacing:2px;margin:0 0 6px;text-shadow:0 0 10px #00f3ff}.sub{text-align:center;color:#9090b5;font-size:13px;margin-bottom:25px}
label{display:block;color:#00f3ff;font-size:12px;margin:14px 0 6px}input{width:100%;padding:13px;border-radius:8px;border:1px solid #38406d;background:#080812;color:#fff;font-size:16px}
button{width:100%;padding:13px;margin-top:10px;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer;background:transparent;color:#00f3ff;border:1px solid #00f3ff}
.primary{background:#ff007f;color:#fff;border-color:#ff007f}.watch{color:#39ff14;border-color:#39ff14}
.help{margin-top:22px;padding:13px;background:#0b0b18;border:1px solid #272b4c;border-radius:9px;color:#aaaacd;font-size:12px;line-height:1.7}
</style>
</head>
<body>
<div class="box">
<h1>CYBER TCG</h1>
<div class="sub">オンライン対戦・観戦ロビー</div>
<label>プレイヤー名</label>
<input id="name" maxlength="20" value="プレイヤー1" placeholder="プレイヤー名">
<button class="primary" id="create">ルームを作る</button>

<label>ルームコード</label>
<input id="room" maxlength="12" placeholder="例：AB12CD">
<button id="join">対戦に参加する</button>
<button class="watch" id="watch">観戦する</button>

<div class="help">
<b>対戦の流れ</b><br>
① 1人目が「ルームを作る」<br>
② 画面に表示された6文字のルームコードを相手へ伝える<br>
③ 2人目がコードを入力して「対戦に参加する」<br>
④ 2人そろったら自動で「対戦開始」<br>
⑤ 3人目以降は同じコードで「観戦する」
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getDatabase,ref,set,get} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig={
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_PROJECT.firebaseapp.com",
  databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId:"YOUR_PROJECT",
  storageBucket:"YOUR_PROJECT.appspot.com",
  messagingSenderId:"YOUR_SENDER_ID",
  appId:"YOUR_APP_ID"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const auth=getAuth(app);

try{await signInAnonymously(auth)}catch(e){
 alert("Firebaseへの接続に失敗しました。READMEのFirebase設定を確認してください。");
 console.error(e);
}

const $=id=>document.getElementById(id);
const makeCode=()=>Math.random().toString(36).substring(2,8).toUpperCase();

$("create").onclick=async()=>{
 const name=$("name").value.trim();
 if(!name)return alert("プレイヤー名を入力してください");
 let code="",exists=true;
 for(let i=0;i<10&&exists;i++){code=makeCode();exists=(await get(ref(db,"rooms/"+code))).exists()}
 if(exists)return alert("ルームコードを作れませんでした。もう一度試してください");

 await set(ref(db,"rooms/"+code),{
   createdAt:Date.now(),
   status:"waiting",
   turn:"p1",
   winner:null,
   players:{
     p1:{name,hp:20,energy:3,score:0,card:null},
     p2:null
   },
   cards:{
     p1:["c1","c2","c3","c4","c5"],
     p2:["c1","c2","c3","c4","c5"]
   },
   log:[`${name}さんがルームを作成しました。相手の参加を待っています。`]
 });
 alert(`ルームを作成しました！\n\nルームコード：${code}\n\nこのコードを対戦相手に伝えてください。`);
 location.href=`game.html?room=${code}&name=${encodeURIComponent(name)}&mode=player`;
};

$("join").onclick=async()=>{
 const name=$("name").value.trim(),code=$("room").value.trim().toUpperCase();
 if(!name)return alert("プレイヤー名を入力してください");
 if(!code)return alert("ルームコードを入力してください");
 const snap=await get(ref(db,"rooms/"+code));
 if(!snap.exists())return alert("そのルームは見つかりません。コードを確認してください。");
 const room=snap.val();
 if(room.players?.p2)return alert("このルームはすでに2人参加しています。観戦してください。");
 await set(ref(db,"rooms/"+code+"/players/p2"),{name,hp:20,energy:3,score:0,card:null});
 await set(ref(db,"rooms/"+code+"/status"),"battle");
 await set(ref(db,"rooms/"+code+"/log"),[...(room.log||[]),`${name}さんが参加しました。対戦開始！`]);
 location.href=`game.html?room=${code}&name=${encodeURIComponent(name)}&mode=player`;
};

$("watch").onclick=async()=>{
 const code=$("room").value.trim().toUpperCase(),name=$("name").value.trim()||"観戦者";
 if(!code)return alert("観戦したいルームコードを入力してください");
 const snap=await get(ref(db,"rooms/"+code));
 if(!snap.exists())return alert("そのルームは見つかりません。");
 location.href=`game.html?room=${code}&name=${encodeURIComponent(name)}&mode=spectator`;
};
</script>
</body>
</html>
